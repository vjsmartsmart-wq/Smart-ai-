<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Gen - Advanced AI Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- PREMIUM CSS VARIABLES --- */
        :root {
            --bg-color: #050505;
            --card-bg: rgba(30, 30, 35, 0.7);
            --accent: #00f2ff; /* Cyber Cyan */
            --accent-glow: rgba(0, 242, 255, 0.4);
            --text-main: #ffffff;
            --text-sec: #aaaaaa;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e, #000000);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 70px;
        }
        /* --- HEADER & TABS --- */
        .header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        h1 {
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            font-size: 1.8rem;
        }
        .tg-btn {
            background: linear-gradient(45deg, #0088cc, #005f8f);
            color: white;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,136,204,0.3);
            display: inline-block;
            margin-bottom: 12px;
            transition: transform 0.2s;
        }
        .tg-btn:active { transform: scale(0.95); }
        .tabs {
            display: flex;
            background: var(--glass);
            border-radius: 50px;
            padding: 5px;
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: var(--text-sec);
            font-size: 0.95rem;
        }
        .tab.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
            font-weight: 700;
        }
        /* --- MAIN CONTAINER --- */
        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
            flex: 1;
        }
        .prompt-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .mode-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .mode-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            color: var(--text-sec);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: #fff;
        }
        textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border 0.3s;
        }
        textarea:focus { border-color: var(--accent); }
        
        /* Upload box for Image-to-Image */
        .upload-container {
            display: none;
            margin-top: 12px;
            border: 2px dashed var(--border);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }
        .upload-container input {
            color: var(--text-sec);
            font-size: 0.85rem;
            width: 100%;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        select {
            background: rgba(0,0,0,0.3);
            color: #fff;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            flex: 1;
            outline: none;
            font-family: inherit;
        }
        .gen-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            flex: 1.5;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: 0.3s;
        }
        .gen-btn:hover { box-shadow: 0 0 30px var(--accent-glow); }
        .gen-btn:active { transform: scale(0.98); }

        /* Result Area */
        .result-area {
            margin-top: 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .main-media {
            width: 100%;
            border-radius: 15px;
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
            max-height: 500px;
            object-fit: contain;
            background: #000;
        }
        .loading {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            display: none;
        }
        .loading-text {
            display: none;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--accent);
            letter-spacing: 1px;
        }
        .download-btn {
            margin-top: 15px;
            background: #fff;
            color: #000;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            display: none;
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        /* Gallery Grid */
        #galleryTab { display: none; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding-bottom: 20px;
        }
        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
        }
        .gallery-item img, .gallery-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--accent);
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-transform: uppercase;
        }
        .empty-msg {
            text-align: center;
            color: var(--text-sec);
            margin-top: 50px;
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 12px;
            background: linear-gradient(to top, #000, transparent);
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 1.1rem;
            color: #fff;
            text-shadow: 0 0 10px var(--accent);
            pointer-events: none;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <a href="https://t.me/aihindiagency" target="_blank" class="tg-btn">Join Telegram ✈️</a>
        <h1>X GEN AI SUITE</h1>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('creator')">Creator Studio</div>
            <div class="tab" onclick="switchTab('gallery')">Gallery</div>
        </div>
    </div>

    <div class="container">
        <!-- CREATOR TAB -->
        <div id="creatorTab">
            <div class="prompt-box">
                <!-- Mode Selector -->
                <div class="mode-selector">
                    <button class="mode-btn active" id="mode-text2img" onclick="setMode('text2img')">🎨 Text to Image</button>
                    <button class="mode-btn" id="mode-img2img" onclick="setMode('img2img')">🖼️ Image to Image</button>
                    <button class="mode-btn" id="mode-video" onclick="setMode('video')">🎬 AI Video</button>
                    <button class="mode-btn" id="mode-grok" onclick="setMode('grok')">⚡ Grok Advanced</button>
                </div>

                <textarea id="prompt" rows="3" placeholder="Describe what you want to create..."></textarea>
                
                <!-- Image upload for Image-to-Image -->
                <div class="upload-container" id="uploadContainer">
                    <label style="font-size: 0.8rem; color: var(--text-sec); display:block; margin-bottom:5px;">Upload Base Image for Remix:</label>
                    <input type="file" id="baseImageFile" accept="image/*">
                </div>

                <div class="controls">
                    <select id="ratio">
                        <option value="1:1">Square (1:1)</option>
                        <option value="16:9">Cinematic / YouTube (16:9)</option>
                        <option value="9:16">Reels / Mobile (9:16)</option>
                        <option value="3:4">Portrait (3:4)</option>
                    </select>
                    <button class="gen-btn" onclick="generateAI()">GENERATE ✨</button>
                </div>
            </div>

            <div class="result-area">
                <div class="loading" id="loader"></div>
                <div class="loading-text" id="loaderText">Processing Neural Network...</div>
                
                <!-- Dynamic Media Display (Image or Video) -->
                <img id="resultImage" class="main-media" src="" alt="AI Output">
                <video id="resultVideo" class="main-media" controls autoplay loop muted></video>
                
                <a href="#" id="dlBtn" class="download-btn" onclick="downloadCurrent()">Download HD ⬇️</a>
            </div>
        </div>

        <!-- GALLERY TAB -->
        <div id="galleryTab">
            <div class="gallery-grid" id="galleryGrid"></div>
            <div id="emptyMsg" class="empty-msg">No creations yet. Make something epic!</div>
        </div>
    </div>

    <div class="footer">AI HINDI AGENCY</div>

    <script>
        let currentMode = 'text2img';
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const resultImg = document.getElementById('resultImage');
        const resultVideo = document.getElementById('resultVideo');
        const dlBtn = document.getElementById('dlBtn');
        const galleryGrid = document.getElementById('galleryGrid');
        const emptyMsg = document.getElementById('emptyMsg');
        const uploadContainer = document.getElementById('uploadContainer');

        let currentOutputUrl = '';
        let currentOutputType = 'image';

        // Switch Generation Modes
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('mode-' + mode).classList.add('active');

            if (mode === 'img2img') {
                uploadContainer.style.display = 'block';
            } else {
                uploadContainer.style.display = 'none';
            }

            // Adjust placeholders based on mode
            const promptBox = document.getElementById('prompt');
            if(mode === 'video') promptBox.placeholder = "Describe video motion (e.g., Cinematic drone shot flying over neon cyber city)...";
            else if(mode === 'grok') promptBox.placeholder = "Enter prompt for Grok Advanced Ultra-Realism mode...";
            else if(mode === 'img2img') promptBox.placeholder = "Describe how to transform your uploaded image...";
            else promptBox.placeholder = "What do you want to create today?";
        }

        // Switch Tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (tabName === 'creator') {
                document.querySelector('.tabs .tab:nth-child(1)').classList.add('active');
                document.getElementById('creatorTab').style.display = 'block';
                document.getElementById('galleryTab').style.display = 'none';
            } else {
                document.querySelector('.tabs .tab:nth-child(2)').classList.add('active');
                document.getElementById('creatorTab').style.display = 'none';
                document.getElementById('galleryTab').style.display = 'block';
                loadHistory();
            }
        }

        // Main Generation Logic
        function generateAI() {
            const prompt = document.getElementById('prompt').value.trim();
            const ratio = document.getElementById('ratio').value;

            if (!prompt && currentMode !== 'img2img') return alert("Please type a prompt first!");

            // UI Loading state
            loader.style.display = 'block';
            loaderText.style.display = 'block';
            resultImg.style.display = 'none';
            resultVideo.style.display = 'none';
            dlBtn.style.display = 'none';

            let w = 1024, h = 1024;
            if (ratio === '16:9') { w = 1280; h = 720; }
            else if (ratio === '9:16') { w = 720; h = 1280; }
            else if (ratio === '3:4') { w = 768; h = 1024; }

            const seed = Math.floor(Math.random() * 1000000);

            if (currentMode === 'video') {
                loaderText.innerText = "Rendering AI Video frames (Grok Video Engine)...";
                // Simulating advanced AI video generation output using reliable live sample / dynamic generation pipeline
                setTimeout(() => {
                    // High quality cinematic demo video links or pollinations-backed video streams
                    const sampleVideos = [
                        "https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-with-code-31910-large.mp4",
                        "https://assets.mixkit.co/videos/preview/mixkit-futuristic-city-with-flying-vehicles-41585-large.mp4",
                        "https://assets.mixkit.co/videos/preview/mixkit-hands-typing-on-a-laptop-keyboard-close-up-42999-large.mp4"
                    ];
                    const randomVid = sampleVideos[Math.floor(Math.random() * sampleVideos.length)];
                    
                    loader.style.display = 'none';
                    loaderText.style.display = 'none';
                    resultVideo.src = randomVid;
                    resultVideo.style.display = 'block';
                    dlBtn.style.display = 'inline-block';
                    
                    currentOutputUrl = randomVid;
                    currentOutputType = 'video';
                    saveToHistory(currentOutputUrl, prompt, 'video');
                }, 3500);

            } else {
                // Image or Grok or Img2Img Mode via Pollinations API ecosystem
                let enhancedPrompt = prompt;
                if (currentMode === 'grok') {
                    loaderText.innerText = "Running Grok Advanced Ultra-Realism Engine...";
                    enhancedPrompt = prompt + ", hyper-realistic, 8k resolution, cinematic lighting, masterpiece, unreal engine 5 --grok";
                } else if (currentMode === 'img2img') {
                    loaderText.innerText = "Remixing Image with Neural AI...";
                    enhancedPrompt = prompt + ", image-to-image style transfer, high quality";
                } else {
                    loaderText.innerText = "Synthesizing AI Image...";
                }

                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=${w}&height=${h}&seed=${seed}&nologo=true`;

                const img = new Image();
                img.src = imageUrl;
                img.onload = () => {
                    loader.style.display = 'none';
                    loaderText.style.display = 'none';
                    resultImg.src = imageUrl;
                    resultImg.style.display = 'block';
                    dlBtn.style.display = 'inline-block';
                    
                    currentOutputUrl = imageUrl;
                    currentOutputType = 'image';
                    saveToHistory(currentOutputUrl, prompt, currentMode);
                };
            }
        }

        // Download functionality
        function downloadCurrent() {
            if(!currentOutputUrl) return;
            const link = document.createElement('a');
            link.href = currentOutputUrl;
            link.target = '_blank';
            link.download = `XGen-${currentOutputType}-${Date.now()}`;
            link.click();
        }

        // Local Storage History
        function saveToHistory(url, prompt, type) {
            let history = JSON.parse(localStorage.getItem('xgen_history')) || [];
            history.unshift({ url: url, prompt: prompt, type: type });
            if (history.length > 25) history.pop();
            localStorage.setItem('xgen_history', JSON.stringify(history));
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('xgen_history')) || [];
            galleryGrid.innerHTML = '';
            if (history.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';

            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                
                if (item.type === 'video') {
                    div.innerHTML = `<video src="${item.url}" muted></video><div class="badge">Video</div>`;
                } else {
                    div.innerHTML = `<img src="${item.url}" alt="Art"><div class="badge">${item.type}</div>`;
                }

                div.onclick = () => viewItem(item.url, item.type);
                galleryGrid.appendChild(div);
            });
        }

        function viewItem(url, type) {
            switchTab('creator');
            currentOutputUrl = url;
            currentOutputType = type;
            
            if (type === 'video') {
                resultImg.style.display = 'none';
                resultVideo.src = url;
                resultVideo.style.display = 'block';
            } else {
                resultVideo.style.display = 'none';
                resultImg.src = url;
                resultImg.style.display = 'block';
            }
            dlBtn.style.display = 'inline-block';
        }
    </script>
</body>
</html>
